<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Weiterleitung blockiert</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="blocked.js"></script>
</head>
<body>
  <div class="sperre">
    <h1>🛑 Weiterleitung blockiert</h1>
    <p class="leise">Eine Seite wollte dich ohne Klick auf eine andere Website schicken.</p>
    <div class="leise">Von</div>
    <div id="von" class="url"></div>
    <div class="leise">Nach</div>
    <div id="nach" class="url"></div>
    <div class="knoepfe">
      <button id="neu" class="gross-knopf">Neuer Tab</button>
      <button id="trotzdem" class="gross-knopf gefahr">Trotzdem öffnen</button>
    </div>
  </div>
</body>
</html>
